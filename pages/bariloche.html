<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Destinos Turísticos</title>
  </head>
  <body>
    <main>
      <section class="container" style="width: 90%; max-width: 1200px">
        <div class="header-box row align-items-center g-4 mx-0 mb-5 mt-4">
          <div class="col-md-6">
            <img
              src="../img/bariloche.jpg.jpeg"
              alt="Bariloche"
              class="mockup-img w-100 rounded-4 shadow-sm"
            />
          </div>
          <div class="col-md-6 text-center text-md-start">
            <h3 class="display-4 fw-bold text-uppercase tracking-wide">
              Bariloche
            </h3>
            <div class="info-datos mt-3 pt-3 border-top">
              <p class="mb-1">
                <strong>💰 Precio promedio:</strong> $150.000 / Temp. Baja
              </p>
              <p class="mb-1"><strong>📍 Distancia:</strong> 1.600 km</p>
              <p class="mb-1">
                <strong>🚗 Auto / Colectivo:</strong> ~18 a 22 horas
              </p>
              <p class="mb-0"><strong>✈️ En Avión:</strong> 2 horas y 20 min</p>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
