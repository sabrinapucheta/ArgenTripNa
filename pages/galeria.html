<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galeriablog" />
    <meta name="author" content="" />
    <link rel="stylesheet" href="../index.html" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <title>Galeria</title>
  </head>
  <body>
    <nav>
      <h1>Mis Postales de Viaje</h1>
    </nav>
    <section class="galeria">
      <figure>
        <img src="../img/bariloche.jpg.jpeg" alt="bariloche" />
        <figcaption>
          <cite title="Source Title">
            Bariloche - Aventuras en la Patagonia.</cite
          >
        </figcaption>
      </figure>

      <figure>
        <img src="../img/brasil.jpg.jpeg" alt="brasil" />
        <figcaption>
          <cite title="source title"
            >Brasil - Playas tropicales y agua cristalina.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img
          src="../img/buenos aires.jpg.jpeg"
          class="img.alta"
          alt="buenos aires"
        />
        <figcaption>
          <cite title="source title"
            >Buenos Aires - Arquitectura y ritmo de la gran ciudad.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/cerro de los siete colores.jpg.jpeg" alt="jujuy" />
        <figcaption>
          <cite title="source title"
            >Cerro de los siete colores, Jujuy - Colores únicos en el norte de
            Jujuy.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/jujuy.jpg.jpeg" alt="jujuy2" />
        <figcaption>
          <cite title="source title"
            >Jujuy - Paisajes andinos y cultura histórica.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/mendoza.jpg.jpeg" alt="mendoza" />
        <figcaption>
          <cite title="source title"
            >Mendoza - Viñedos al pie de la Cordillera.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/necochea.jpg.jpeg" alt="necochea" />
        <figcaption>
          <cite title="source title"
            >Necochea - Extensas playas junto al Atlántico.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/neuquen.jpg.jpeg" alt="neuquen" />
        <figcaption>
          <cite title="source title"
            >Neuquen - Ríos, lagos y naturaleza pura.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/san martin de los andes.jpg.jpeg" alt="san martin" />
        <figcaption>
          <cite title="source title"
            >San Martin de los Andes, Mendoza - Una postal típica de la
            Patagonia.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/tucuman.jpg.jpeg" alt="tucuman" />
        <figcaption>
          <cite title="source title"
            >Tucuman - Naturaleza y verde en las yungas.</cite
          >
        </figcaption>
      </figure>
    </section>
    <footer>

    </footer>
  </body>
</html>
