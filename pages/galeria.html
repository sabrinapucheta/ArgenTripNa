<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galeriablog" />
    <meta name="author" content="" />
    <link rel="stylesheet" href="../index.html" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <title>Galeria</title>
  </head>
  <body>
    <nav></nav>
    <section>
      <h1>Mis Postales de Viaje</h1>
    </section>
    <section class="galeria">
      <figure>
        <img src="../img/bariloche.jpg.jpeg" alt="bariloche" />

        <figcaption>
          <h5 class="card-text">Bariloche</h5>
          <cite title="Source Title"> Aventuras en la Patagonia.</cite>
        </figcaption>
      </figure>

      <figure>
        <img src="../img/brasil.jpg.jpeg" alt="brasil" />
        <figcaption>
          <h5 class="card-text">Brasil</h5>
          <cite title="source title">Playas tropicales y agua cristalina.</cite>
        </figcaption>
      </figure>
      <figure>
        <img
          src="../img/buenos aires.jpg.jpeg"
          class="img.alta"
          alt="buenos aires"
        />
        <figcaption>
          <h5 class="card-text">Buenos Aires</h5>
          <cite title="source title"
            >Arquitectura y ritmo de la gran ciudad.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/cerro de los siete colores.jpg.jpeg" alt="jujuy" />
        <figcaption>
          <h5 class="card-text">Cerro de los Siete Colores, Jujuy</h5>
          <cite title="source title"
            >Cerro de los siete colores, únicos en el norte de Jujuy.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/jujuy.jpg.jpeg" alt="jujuy2" />
        <figcaption>
          <h5 class="card-text">Jujuy</h5>
          <cite title="source title"
            >Jujuy - Paisajes andinos y cultura histórica.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/mendoza.jpg.jpeg" alt="mendoza" />
        <figcaption>
          <h5 class="card-text">Mendoza</h5>
          <cite title="source title">Viñedos al pie de la Cordillera.</cite>
        </figcaption>
      </figure>
      <figure>
        <img src="../img/necochea.jpg.jpeg" alt="necochea" />
        <figcaption>
          <h5 class="card-text">Necochea</h5>
          <cite title="source title">Extensas playas junto al Atlántico.</cite>
        </figcaption>
      </figure>
      <figure>
        <img src="../img/neuquen.jpg.jpeg" alt="neuquen" />
        <figcaption>
          <h5 class="card-text">Neuquen</h5>
          <cite title="source title">Ríos, lagos y naturaleza pura.</cite>
        </figcaption>
      </figure>
      <figure>
        <img src="../img/san martin de los andes.jpg.jpeg" alt="san martin" />
        <figcaption>
          <h5 class="card-text">San Martin de los Andes</h5>
          <cite title="source title"
            >Mendoza, una postal típica de la Patagonia.</cite
          >
        </figcaption>
      </figure>
      <figure>
        <img src="../img/tucuman.jpg.jpeg" alt="tucuman" />
        <figcaption>
          <h5 class="card-text">Tucuman</h5>
          <cite title="source title">Naturaleza y verde en las yungas.</cite>
        </figcaption>
      </figure>
    </section>
    <footer></footer>
  </body>
</html>
