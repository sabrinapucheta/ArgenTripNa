<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Hernan Evis" />
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Iniciar Sesión - ArgenTripNA</title>
  </head>
  <body class="body-login bg-light text-center">
    <main class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card p-4 shadow text-bg-warning">
            <h2 class="text-center mb-4 text-dark">Bienvenido Viajero</h2>
            <form>
              <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="viajero@ejemplo.com" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
              </div>
           <button type="submit" class="btn btn-warning w-100 transition-button">Ingresar</button>
            </form>
            <div class="text-center mt-3">
              <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/bootstrap.min.js"></script>
  </body>
</html>
